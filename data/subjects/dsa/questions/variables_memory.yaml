concept_id: variables_memory
questions:
  - id: variables_memory-q01
    type: mcq
    difficulty: 1
    prompt: "In Python, what does the expression 7 // 2 evaluate to?"
    options:
      - {id: a, text: "3"}
      - {id: b, text: "3.5", why_wrong: "That is the result of 7 / 2; the double slash performs floor division."}
      - {id: c, text: "4", why_wrong: "Floor division rounds down, not to nearest or up."}
      - {id: d, text: "2", why_wrong: "2 is only the divisor; the quotient of 7 divided by 2 is not 2."}
    answer: a
    explanation: "Floor division discards the fractional part, so 7 // 2 is 3 while 7 / 2 is 3.5."
    misconception_tag: integer_division
    diagnoses_prereq: null

  - id: variables_memory-q02
    type: mcq
    difficulty: 1
    prompt: "In Python, what does the expression 9 // 2 evaluate to?"
    options:
      - {id: a, text: "4.5", why_wrong: "That is 9 / 2; the double slash performs floor division."}
      - {id: b, text: "5", why_wrong: "Floor division rounds down, not up."}
      - {id: c, text: "4"}
      - {id: d, text: "1", why_wrong: "That is the remainder 9 % 2, not the quotient."}
    answer: c
    explanation: "9 divided by 2 is 4.5, and floor division keeps only the integer part, 4."
    misconception_tag: integer_division
    diagnoses_prereq: null

  - id: variables_memory-q03
    type: mcq
    difficulty: 2
    prompt: "A program sums floating-point values and then tests `total == 0.3` after adding 0.1 and 0.2, but the test fails. What is the best explanation and fix?"
    options:
      - {id: a, text: "The addition is buggy; use integers only.", why_wrong: "Floating-point addition is correctly rounded; the issue is representation, not a faulty add."}
      - {id: b, text: "Decimal fractions such as 0.1 are stored approximately in binary; compare with a small tolerance."}
      - {id: c, text: "The variable is too small; declare it as a long.", why_wrong: "A wider integer type has nothing to do with fractional rounding."}
      - {id: d, text: "== cannot be used with numbers; use the is operator.", why_wrong: "`is` compares object identity and would be wrong here; the equality operator works, but the values differ slightly."}
    answer: b
    explanation: "0.1 and 0.2 cannot be represented exactly in binary, so their sum is 0.30000000000000004. Compare with abs(a - b) < epsilon."
    misconception_tag: float_equality
    diagnoses_prereq: null

  - id: variables_memory-q04
    type: mcq
    difficulty: 2
    prompt: "A C++ program keeps a counter in a 32-bit unsigned integer. It holds 4,294,967,295 and is incremented once. What does it hold afterwards?"
    options:
      - {id: a, text: "4,294,967,296", why_wrong: "That value does not fit in 32 unsigned bits; unsigned arithmetic wraps modulo 2^32."}
      - {id: b, text: "-1", why_wrong: "Unsigned types never hold negative values."}
      - {id: c, text: "An exception is thrown.", why_wrong: "C++ does not check integer overflow; the result silently wraps."}
      - {id: d, text: "0"}
    answer: d
    explanation: "Unsigned arithmetic is defined modulo 2^32, so the maximum value plus one wraps to 0."
    misconception_tag: integer_overflow
    diagnoses_prereq: null

  - id: variables_memory-q05
    type: multi_select
    difficulty: 2
    prompt: "Select every true statement about numbers in programs."
    options:
      - {id: a, text: "Python integers can grow beyond 64 bits without overflowing."}
      - {id: b, text: "A 32-bit signed integer can store values up to about 2.1 billion."}
      - {id: c, text: "0.1 + 0.2 equals exactly 0.3 in binary floating point.", why_wrong: "The binary representations are approximate, so the sum differs slightly from 0.3."}
      - {id: d, text: "Integer division in C++ rounds 7 / 2 up to 4.", why_wrong: "Integer division truncates toward zero, giving 3."}
    answer: [a, b]
    explanation: "Python integers are arbitrary precision, and 2^31 - 1 is about 2.1 billion. The float and integer-division claims are the classic misconceptions."
    misconception_tag: number_representation
    diagnoses_prereq: null

  - id: variables_memory-q06
    type: true_false
    difficulty: 1
    prompt: "True or false: the same sequence of bits can mean different things depending on the data type used to read it."
    answer: true
    explanation: "Memory holds only bits; the type decides whether they are read as an integer, a character, a float or something else."
    misconception_tag: types_and_bits
    diagnoses_prereq: null

  - id: variables_memory-q07
    type: code_output
    difficulty: 2
    prompt: "What does this program print?"
    code: |
      a = "3"
      b = "4"
      c = 3
      d = 4
      print(a + b, c + d, 7 // 2)
    answer: "34 7 3"
    explanation: "Adding strings joins them, adding integers sums them, and floor division of 7 by 2 gives 3."
    misconception_tag: operator_depends_on_type
    diagnoses_prereq: null

  - id: variables_memory-q08
    type: short_answer
    difficulty: 3
    prompt: "A player's score is stored in a 32-bit signed integer in a C++ game and eventually becomes a large negative number. Explain what happened and one way to avoid it."
    answer: "The score exceeded the maximum 32-bit signed value of about 2.1 billion and overflowed, wrapping to a negative number. Use a wider type such as 64-bit integers or check for overflow before adding."
    explanation: "A full answer names integer overflow, explains the fixed range of the type, and proposes a wider type or a guard."
    rubric:
      key_points:
        - "integer overflow beyond the fixed 32-bit range"
        - "value wraps to a negative number"
        - "use a wider type (64-bit) or check before adding"
      max_score: 1
      partial_credit: true
    misconception_tag: integer_overflow
    diagnoses_prereq: null
