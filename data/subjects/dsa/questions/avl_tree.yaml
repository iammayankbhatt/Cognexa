concept_id: avl_tree
questions:
  - id: avl_tree-q01
    type: mcq
    difficulty: 1
    prompt: "What rule defines an AVL tree?"
    options:
      - {id: a, text: "It is a binary search tree in which the heights of every node's two subtrees differ by at most 1"}
      - {id: b, text: "It is a binary tree where all leaves are at the same depth", why_wrong: "That describes a perfect tree, which is far stricter than AVL."}
      - {id: c, text: "It is a heap that is also sorted", why_wrong: "AVL trees are search trees, not heaps."}
      - {id: d, text: "It is a binary search tree where no node has two children", why_wrong: "That would be a chain."}
    answer: a
    explanation: "AVL trees keep the BST ordering and add a height-balance condition checked at every node."
    misconception_tag: avl_definition
    diagnoses_prereq: bst

  - id: avl_tree-q02
    type: mcq
    difficulty: 1
    prompt: "What is the worst-case time of searching an AVL tree with n keys?"
    options:
      - {id: a, text: "O(log n)"}
      - {id: b, text: "O(n)", why_wrong: "That is the worst case of a plain BST, which AVL balancing prevents."}
      - {id: c, text: "O(1)", why_wrong: "The search still follows a root-to-node path."}
      - {id: d, text: "O(n log n)", why_wrong: "A single search touches one path, not all items."}
    answer: a
    explanation: "Balancing keeps the height at most about 1.44 log2 n, so any search follows a logarithmic path."
    misconception_tag: avl_search_cost
    diagnoses_prereq: bst

  - id: avl_tree-q03
    type: mcq
    difficulty: 2
    prompt: "Keys 10, 20, 30 are inserted in this order into an empty AVL tree. What is the root after rebalancing?"
    options:
      - {id: a, text: "20"}
      - {id: b, text: "10", why_wrong: "10 would remain the root only in a plain BST, which becomes a chain."}
      - {id: c, text: "30", why_wrong: "30 is the largest key and would be a leaf."}
      - {id: d, text: "It depends on the implementation", why_wrong: "The result of a left rotation here is determined."}
    answer: a
    explanation: "Inserting 30 makes the root 10 right-heavy by 2 (Right-Right case). A left rotation at 10 promotes 20 to the root."
    misconception_tag: avl_rr_rotation
    diagnoses_prereq: bst

  - id: avl_tree-q04
    type: mcq
    difficulty: 2
    prompt: "A node has balance factor +2 and its left child has balance factor -1. Which fix is correct?"
    options:
      - {id: a, text: "Left-rotate the left child, then right-rotate the node"}
      - {id: b, text: "Right-rotate the node only", why_wrong: "A single right rotation leaves the zig-zag shape still unbalanced."}
      - {id: c, text: "Left-rotate the node only", why_wrong: "That rotation is for a right-heavy node."}
      - {id: d, text: "Delete the left child", why_wrong: "Deleting data is never a balancing step."}
    answer: a
    explanation: "A left-heavy node whose left child leans right is a Left-Right case, which needs a double rotation."
    misconception_tag: avl_double_rotation
    diagnoses_prereq: bst

  - id: avl_tree-q05
    type: multi_select
    difficulty: 2
    prompt: "Select every true statement about rotations in an AVL tree."
    options:
      - {id: a, text: "A rotation preserves the inorder order of the keys."}
      - {id: b, text: "A single rotation takes O(1) time."}
      - {id: c, text: "A rotation changes the sorted order of the keys.", why_wrong: "Rotations preserve the binary search tree ordering."}
      - {id: d, text: "A rotation can only be applied to the root.", why_wrong: "Rotations are applied at any unbalanced node on the path."}
    answer: [a, b]
    explanation: "A rotation re-links a constant number of references and keeps the BST invariant."
    misconception_tag: rotation_properties
    diagnoses_prereq: bst

  - id: avl_tree-q06
    type: true_false
    difficulty: 2
    prompt: "True or false: an AVL tree must be perfectly balanced, with all leaves at the same depth."
    answer: false
    explanation: "AVL only requires the two subtree heights at each node to differ by at most one, so leaves can be at different depths."
    misconception_tag: avl_vs_perfect
    diagnoses_prereq: bst

  - id: avl_tree-q07
    type: code_output
    difficulty: 3
    prompt: "What does this program print?"
    code: |
      class N:
          def __init__(self, k):
              self.k, self.l, self.r, self.h = k, None, None, 0

      def H(n):
          return -1 if n is None else n.h

      def fix(n):
          n.h = 1 + max(H(n.l), H(n.r))

      def rot_left(x):
          y = x.r
          x.r, y.l = y.l, x
          fix(x)
          fix(y)
          return y

      a = N(1)
      a.r = N(2)
      a.r.r = N(3)
      fix(a.r)
      fix(a)
      root = rot_left(a)
      print(root.k, root.l.k, root.r.k, root.h)
    answer: "2 1 3 1"
    explanation: "The chain 1, 2, 3 is rotated left at 1, so 2 becomes the root with children 1 and 3 and its height is 1."
    misconception_tag: avl_rotation_trace
    diagnoses_prereq: bst

  - id: avl_tree-q08
    type: short_answer
    difficulty: 3
    prompt: "Why does an AVL tree guarantee O(log n) height while a plain binary search tree does not?"
    answer: "A plain BST can receive keys in sorted order and become a chain of height n - 1. An AVL tree checks the height difference of the two subtrees at each node after every insert or delete and fixes any difference of 2 with rotations. A tree that keeps this balance condition needs at least a Fibonacci-like number of nodes for each height, so the height can only be about 1.44 log2 n."
    explanation: "A good answer mentions the balance condition, rotations as repair, and the logarithmic height bound."
    rubric:
      key_points:
        - "plain BST can become a chain"
        - "AVL checks balance after updates and repairs it with rotations"
        - "balance condition forces height to be O(log n)"
      max_score: 1
      partial_credit: true
    misconception_tag: avl_height_guarantee
    diagnoses_prereq: bst
