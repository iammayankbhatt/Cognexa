concept_id: linear_search
questions:
  - id: linear_search-q01
    type: mcq
    difficulty: 1
    prompt: "In the worst case, how many comparisons does linear search make on an array of n elements?"
    options:
      - {id: a, text: "1", why_wrong: "One comparison is the best case, when the first element matches."}
      - {id: b, text: "log n", why_wrong: "Logarithmic cost belongs to binary search on sorted data."}
      - {id: c, text: "n"}
      - {id: d, text: "n squared", why_wrong: "Each element is examined at most once, so the cost is linear."}
    answer: c
    explanation: "If the target is last or absent every element is compared once, giving n comparisons."
    misconception_tag: linear_worst_case
    diagnoses_prereq: arrays

  - id: linear_search-q02
    type: mcq
    difficulty: 1
    prompt: "In the best case, how many comparisons does linear search make?"
    options:
      - {id: a, text: "1"}
      - {id: b, text: "n / 2", why_wrong: "That is the average for a successful search, not the best case."}
      - {id: c, text: "n", why_wrong: "That is the worst case."}
      - {id: d, text: "0", why_wrong: "At least one comparison is needed to look at the first element."}
    answer: a
    explanation: "The best case happens when the first element equals the target."
    misconception_tag: linear_best_case
    diagnoses_prereq: arrays

  - id: linear_search-q03
    type: mcq
    difficulty: 2
    prompt: "A program checks `if x in big_list` for each of n items x in another list, where big_list also has n items. What is the overall complexity?"
    options:
      - {id: a, text: "O(n)", why_wrong: "Each membership test is itself a linear scan, not constant time."}
      - {id: b, text: "O(n squared)"}
      - {id: c, text: "O(log n)", why_wrong: "A list membership test is a plain scan and does not halve anything."}
      - {id: d, text: "O(1)", why_wrong: "The work grows with n."}
    answer: b
    explanation: "n membership tests each cost O(n), for O(n squared) in total. Converting big_list to a set makes each test about O(1)."
    misconception_tag: hidden_quadratic
    diagnoses_prereq: arrays

  - id: linear_search-q04
    type: mcq
    difficulty: 2
    prompt: "A linear search function returns 0 when the target is not found. What is the problem?"
    options:
      - {id: a, text: "0 is also a valid index, so the caller cannot tell 'found at index 0' from 'not found'"}
      - {id: b, text: "Returning numbers is not allowed", why_wrong: "Returning an integer is fine; the choice of value is the issue."}
      - {id: c, text: "The search becomes quadratic", why_wrong: "The return value does not change the running time."}
      - {id: d, text: "The array is modified", why_wrong: "Linear search does not modify the array."}
    answer: a
    explanation: "Use a value outside the valid index range, such as -1 or None, to signal absence."
    misconception_tag: sentinel_return_value
    diagnoses_prereq: arrays

  - id: linear_search-q05
    type: multi_select
    difficulty: 2
    prompt: "Select every true statement about linear search."
    options:
      - {id: a, text: "It works on unsorted data."}
      - {id: b, text: "It uses O(1) extra space."}
      - {id: c, text: "It requires the array to be sorted.", why_wrong: "Sorting is only required for binary search."}
      - {id: d, text: "It is always faster than binary search.", why_wrong: "On large sorted data binary search is much faster; linear search wins mainly on tiny or unsorted data."}
    answer: [a, b]
    explanation: "Linear search needs no ordering and only an index. It is not always the fastest."
    misconception_tag: linear_search_facts
    diagnoses_prereq: null

  - id: linear_search-q06
    type: true_false
    difficulty: 1
    prompt: "True or false: for a successful search where the target is equally likely to be at any position, linear search makes about n/2 comparisons on average."
    answer: true
    explanation: "The expected position is the middle, so on average about half of the elements are examined."
    misconception_tag: linear_average_case
    diagnoses_prereq: null

  - id: linear_search-q07
    type: code_output
    difficulty: 2
    prompt: "What does this program print?"
    code: |
      def search(values, target):
          steps = 0
          for i, v in enumerate(values):
              steps += 1
              if v == target:
                  return i, steps
          return -1, steps

      print(search([4, 9, 7, 1, 7], 7), search([4, 9, 7], 5))
    answer: "(2, 3) (-1, 3)"
    explanation: "The first search stops at index 2 after 3 comparisons. The second does not find 5 and checks all 3 elements."
    misconception_tag: counting_comparisons
    diagnoses_prereq: arrays

  - id: linear_search-q08
    type: short_answer
    difficulty: 3
    prompt: "When is linear search a better choice than binary search?"
    answer: "Linear search is better when the data is unsorted, when the collection is very small, when you search only once so sorting would cost more than it saves, or when elements can only be reached sequentially, as in a linked list. Binary search needs sorted random-access data."
    explanation: "A good answer names at least two situations, such as unsorted data and one-off or tiny searches."
    rubric:
      key_points:
        - "data is unsorted or sorting would cost more than a single search"
        - "tiny collections or sequential-only access"
        - "binary search requires sorted data with random access"
      max_score: 1
      partial_credit: true
    misconception_tag: choosing_search
    diagnoses_prereq: arrays
