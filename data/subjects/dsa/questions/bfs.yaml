concept_id: bfs
questions:
  - id: bfs-q01
    type: mcq
    difficulty: 1
    prompt: "What data structure does breadth-first search use to hold the vertices waiting to be explored?"
    options:
      - {id: a, text: "A queue"}
      - {id: b, text: "A stack", why_wrong: "A stack gives depth-first order."}
      - {id: c, text: "A priority queue", why_wrong: "That is used by Dijkstra's algorithm for weighted edges."}
      - {id: d, text: "A binary search tree", why_wrong: "BFS needs first-in first-out order, not sorted order."}
    answer: a
    explanation: "A queue serves vertices in the order they were discovered, which produces the layer-by-layer exploration."
    misconception_tag: bfs_queue
    diagnoses_prereq: queue

  - id: bfs-q02
    type: mcq
    difficulty: 1
    prompt: "What is the time complexity of BFS on a graph stored as an adjacency list with V vertices and E edges?"
    options:
      - {id: a, text: "O(V + E)"}
      - {id: b, text: "O(V * E)", why_wrong: "Each vertex and each adjacency entry is processed once, not once per pair."}
      - {id: c, text: "O(V squared) always", why_wrong: "That is the cost with an adjacency matrix."}
      - {id: d, text: "O(E log V)", why_wrong: "No heap or sorting is involved in plain BFS."}
    answer: a
    explanation: "Each vertex enters the queue once and each adjacency list is scanned once."
    misconception_tag: bfs_complexity
    diagnoses_prereq: graph_representation

  - id: bfs-q03
    type: mcq
    difficulty: 2
    prompt: "In which kind of graph does BFS find the path with the minimum total cost between two vertices?"
    options:
      - {id: a, text: "Graphs where every edge has the same cost (unweighted graphs)"}
      - {id: b, text: "Any weighted graph", why_wrong: "With different weights, a path with fewer edges may cost more."}
      - {id: c, text: "Only graphs with negative weights", why_wrong: "BFS ignores weights altogether."}
      - {id: d, text: "Only trees", why_wrong: "It also works on general unweighted graphs."}
    answer: a
    explanation: "BFS minimises the number of edges. That equals the cost only when every edge costs the same."
    misconception_tag: bfs_weighted
    diagnoses_prereq: graph_representation

  - id: bfs-q04
    type: mcq
    difficulty: 2
    prompt: "A BFS implementation marks vertices visited only when it removes them from the queue. On a dense graph it becomes extremely slow and the queue grows huge. Why?"
    options:
      - {id: a, text: "The same vertex is added to the queue many times before it is removed"}
      - {id: b, text: "The queue is a stack", why_wrong: "That would change the order but not cause duplicate insertions."}
      - {id: c, text: "The graph has no edges", why_wrong: "Then the search would end immediately."}
      - {id: d, text: "The start vertex is wrong", why_wrong: "The start vertex does not cause repeated enqueues."}
    answer: a
    explanation: "Until a vertex is removed it is still unmarked, so every neighbour that discovers it enqueues it again. Mark on discovery."
    misconception_tag: bfs_mark_on_discovery
    diagnoses_prereq: queue

  - id: bfs-q05
    type: multi_select
    difficulty: 2
    prompt: "Select every true statement about BFS."
    options:
      - {id: a, text: "It can find the shortest path in terms of edges in an unweighted graph."}
      - {id: b, text: "It can count the connected components of an undirected graph."}
      - {id: c, text: "It uses a stack to store the frontier.", why_wrong: "BFS uses a queue."}
      - {id: d, text: "It always uses less memory than DFS.", why_wrong: "BFS can hold a whole layer of vertices, which can be larger than a DFS path."}
    answer: [a, b]
    explanation: "BFS gives distances in edges and can be repeated from unvisited vertices to count components. Its queue can be large."
    misconception_tag: bfs_uses
    diagnoses_prereq: queue

  - id: bfs-q06
    type: true_false
    difficulty: 1
    prompt: "True or false: BFS visits every vertex at distance 1 from the start before any vertex at distance 2."
    answer: true
    explanation: "The FIFO queue guarantees that layers are processed in order of distance."
    misconception_tag: bfs_layers
    diagnoses_prereq: queue

  - id: bfs-q07
    type: code_output
    difficulty: 2
    prompt: "What does this program print?"
    code: |
      from collections import deque

      adj = {0: [1, 2], 1: [3], 2: [3], 3: []}
      dist = {0: 0}
      q = deque([0])
      while q:
          u = q.popleft()
          for v in adj[u]:
              if v not in dist:
                  dist[v] = dist[u] + 1
                  q.append(v)
      print(dist)
    answer: "{0: 0, 1: 1, 2: 1, 3: 2}"
    explanation: "Vertices 1 and 2 are discovered from 0 at distance 1. Vertex 3 is first discovered from 1 at distance 2, and 2 does not change it."
    misconception_tag: bfs_trace
    diagnoses_prereq: queue

  - id: bfs-q08
    type: short_answer
    difficulty: 3
    prompt: "Explain why BFS gives the shortest path in an unweighted graph, and why it does not for a weighted graph."
    answer: "BFS processes vertices in order of increasing number of edges from the start because the queue is first-in first-out, so the first time a vertex is discovered it is reached by a path with the fewest possible edges. If edges have different weights, a path with more edges can have a smaller total weight, but BFS only counts edges, so it can miss the cheaper path. Dijkstra's algorithm handles weights."
    explanation: "A good answer connects the FIFO order to layers and says BFS counts edges, not weights."
    rubric:
      key_points:
        - "queue processes vertices in order of edge distance"
        - "first discovery uses the fewest edges"
        - "weights can make a longer path cheaper, so BFS fails there"
      max_score: 1
      partial_credit: true
    misconception_tag: bfs_shortest_path_reason
    diagnoses_prereq: queue
