concept_id: bitwise_operations
questions:
  - id: bitwise_operations-q01
    type: mcq
    difficulty: 1
    prompt: "What is 12 & 10?"
    options:
      - {id: a, text: "8"}
      - {id: b, text: "14", why_wrong: "14 is 12 | 10 (OR); AND keeps only bits set in both."}
      - {id: c, text: "6", why_wrong: "6 is 12 ^ 10 (XOR)."}
      - {id: d, text: "22", why_wrong: "22 is 12 + 10; & is bitwise AND, not addition."}
    answer: a
    explanation: "1100 & 1010 = 1000, which is 8."
    misconception_tag: and_or_xor
    diagnoses_prereq: binary_numbers

  - id: bitwise_operations-q02
    type: mcq
    difficulty: 1
    prompt: "Which expression sets bit 3 of x (counting from bit 0) and leaves the other bits unchanged?"
    options:
      - {id: a, text: "x | (1 << 3)"}
      - {id: b, text: "x & (1 << 3)", why_wrong: "AND with the mask tests bit 3 and clears all the others."}
      - {id: c, text: "x ^ (1 << 3)", why_wrong: "XOR toggles the bit: it clears it if it was already set."}
      - {id: d, text: "x + 3", why_wrong: "Adding 3 changes the low bits and can carry; it does not set bit 3."}
    answer: a
    explanation: "OR with a mask that has a 1 only at position 3 forces that bit to 1 and keeps the rest."
    misconception_tag: set_vs_toggle
    diagnoses_prereq: null

  - id: bitwise_operations-q03
    type: mcq
    difficulty: 2
    prompt: "What does x & (x - 1) compute for a positive integer x?"
    options:
      - {id: a, text: "x with its lowest set bit cleared"}
      - {id: b, text: "Always 0", why_wrong: "It is 0 only when x is a power of two (a single set bit)."}
      - {id: c, text: "x - 1", why_wrong: "Subtracting 1 flips the low bits, and the AND keeps only the bits shared with x."}
      - {id: d, text: "The lowest set bit of x on its own", why_wrong: "That is x & -x; x & (x - 1) removes that bit instead."}
    answer: a
    explanation: "x - 1 flips the lowest set bit and every 0 below it, so the AND keeps all higher bits and drops the lowest 1."
    misconception_tag: lowest_set_bit
    diagnoses_prereq: binary_numbers

  - id: bitwise_operations-q04
    type: mcq
    difficulty: 2
    prompt: "In Python, what is the value of 2 ^ 3?"
    options:
      - {id: a, text: "1"}
      - {id: b, text: "8", why_wrong: "^ is XOR in Python; 2 ** 3 is the power that gives 8."}
      - {id: c, text: "6", why_wrong: "6 is 2 * 3; ^ is bitwise XOR."}
      - {id: d, text: "5", why_wrong: "5 is 2 + 3 (and also 2 | 3 would be 3); XOR of 10 and 11 is 01."}
    answer: a
    explanation: "10 ^ 11 = 01, so the result is 1. Use 2 ** 3 or 1 << 3 for eight."
    misconception_tag: xor_is_not_power
    diagnoses_prereq: null

  - id: bitwise_operations-q05
    type: multi_select
    difficulty: 2
    prompt: "Select every expression that equals 40 when x = 5."
    options:
      - {id: a, text: "x << 3"}
      - {id: b, text: "x * 8"}
      - {id: c, text: "(x << 2) | (x << 3) ^ 20", why_wrong: "^ binds more tightly than | in Python, giving 20 | (40 ^ 20) = 60."}
      - {id: d, text: "(x | 0b101000) & 0b101000"}
    answer: [a, b, d]
    explanation: "Shifting left by 3 multiplies by 8; masking (5 | 40) with 40 keeps exactly 40. Option c evaluates to 60."
    misconception_tag: shifts_multiply
    diagnoses_prereq: null

  - id: bitwise_operations-q06
    type: true_false
    difficulty: 1
    prompt: "True or false: for any integer a, a ^ a equals 0."
    answer: true
    explanation: "XOR sets a bit only where the inputs differ, and a number never differs from itself."
    misconception_tag: and_or_xor
    diagnoses_prereq: null

  - id: bitwise_operations-q07
    type: code_output
    difficulty: 2
    prompt: "What does this program print?"
    code: |
      x = 0b101100
      x |= 1
      x &= ~(1 << 2)
      x ^= 1 << 5
      print(x, bin(x))
    answer: "9 0b1001"
    explanation: "Setting bit 0 gives 101101 (45), clearing bit 2 gives 101001 (41), toggling bit 5 gives 001001 (9)."
    misconception_tag: set_vs_toggle
    diagnoses_prereq: null

  - id: bitwise_operations-q08
    type: short_answer
    difficulty: 2
    prompt: "Explain how to check whether bit i of an integer x is set, and why it works."
    answer: "Shift x right by i places and AND the result with 1, or AND x with the mask 1 << i and check for a non-zero result. The mask has a 1 only in position i, so AND clears every other bit and leaves just bit i."
    explanation: "A good answer gives one of the two expressions and explains that the mask isolates bit i because AND clears the other positions."
    rubric:
      key_points:
        - "(x >> i) & 1, or x & (1 << i) compared with 0"
        - "the mask has a single 1 in position i"
        - "AND clears all other bits, so only bit i remains"
      max_score: 1
      partial_credit: true
    misconception_tag: bit_test
    diagnoses_prereq: binary_numbers
