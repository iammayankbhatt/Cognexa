name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cognexa
          POSTGRES_PASSWORD: cognexa_ci_password
          POSTGRES_DB: cognexa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cognexa -d cognexa"
          --health-interval 5s --health-timeout 5s --health-retries 10
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/cognexa_ci_password
        ports: ["7687:7687"]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p cognexa_ci_password 'RETURN 1'"
          --health-interval 10s --health-timeout 10s --health-retries 12 --health-start-period 30s
    env:
      DATABASE_URL: postgresql+asyncpg://cognexa:cognexa_ci_password@localhost:5432/cognexa
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: cognexa_ci_password
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy app
      - name: Pytest
        run: uv run pytest -q

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
