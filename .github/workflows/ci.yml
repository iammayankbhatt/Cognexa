name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cognexa
          POSTGRES_PASSWORD: cognexa_ci_password
          POSTGRES_DB: cognexa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cognexa -d cognexa"
          --health-interval 5s --health-timeout 5s --health-retries 10
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/cognexa_ci_password
        ports: ["7687:7687"]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p cognexa_ci_password 'RETURN 1'"
          --health-interval 10s --health-timeout 10s --health-retries 12 --health-start-period 30s
    env:
      DATABASE_URL: postgresql+asyncpg://cognexa:cognexa_ci_password@localhost:5432/cognexa
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: cognexa_ci_password
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check . ../../evaluation
      - name: Ruff format
        run: uv run ruff format --check . ../../evaluation
      - name: Mypy
        run: uv run mypy app
      - name: Validate concept graph
        run: uv run python ../../scripts/validate_graph.py
      - name: Validate content (notes, questions, study sets, eval set)
        run: uv run python ../../scripts/validate_content.py --strict
      - name: Pytest (includes live Neo4j / Postgres integration tests)
        run: uv run pytest -q
      - name: Tutor pipeline smoke run (offline, fake providers)
        run: uv run python ../../scripts/phase6_smoke.py --offline --out "$RUNNER_TEMP/phase6_smoke.md"
      - name: Migrate and seed smoke test
        run: |
          uv run python ../../scripts/migrate.py
          uv run python ../../scripts/seed_postgres.py
          uv run python ../../scripts/seed_neo4j.py
          uv run python ../../scripts/seed_neo4j.py
          uv run python ../../scripts/seed_vectors.py
          uv run python ../../scripts/seed_vectors.py

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: No secrets in the client bundle
        run: npm run check:bundle

  container:
    name: API container (build, boot, /health)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image (same Dockerfile and context as render.yaml)
        run: docker build -f apps/api/Dockerfile -t cognexa-api:ci .
      - name: Boot it on a custom $PORT and probe /health
        run: |
          docker run -d --name api -p 8080:9000 -e PORT=9000 cognexa-api:ci
          for i in $(seq 1 30); do curl -fsS localhost:8080/health && break; sleep 1; done
          curl -fsS localhost:8080/health | grep -q '"ok"'
      - name: Runs as non-root and bundles the subject data
        run: |
          test "$(docker exec api id -u)" != "0"
          docker exec api python -c "from app.graph.loader import SUBJECTS_DIR; assert (SUBJECTS_DIR / 'dsa' / 'concepts.yaml').is_file()"
      - name: Production config audit is logged
        if: always()
        run: docker logs api 2>&1 | grep -q "production config:"

  e2e:
    name: End-to-end (Playwright on local Supabase + Neo4j, fake AI)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 45
    services:
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/cognexa_ci_password
        ports: ["7687:7687"]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p cognexa_ci_password 'RETURN 1'"
          --health-interval 10s --health-timeout 10s --health-retries 12 --health-start-period 30s
    env:
      # API: the Supabase local stack's database and auth, Neo4j service, fake AI providers
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      SUPABASE_URL: http://127.0.0.1:54321
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: cognexa_ci_password
      LLM_PRIMARY_PROVIDER: fake
      LLM_FALLBACK_PROVIDER: fake
      LLM_JUDGE_PROVIDER: fake
      EMBEDDING_PROVIDER: fake
      ALLOWED_ORIGINS: http://localhost:3000
      # web
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      # a missing stack fails the run instead of skipping specs
      E2E_REQUIRE_STACK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Start the Supabase local stack (auth, database, mail)
        run: |
          # The local ES256 signing key is gitignored. A freshly generated key left PostgREST
          # unable to verify the service key in CI (BUG-046), so CI uses the stack's default
          # HS256 secret for every service; the API verifies it with SUPABASE_JWT_SECRET.
          sed -i '/^signing_keys_path/d' supabase/config.toml
          npx --yes supabase@3.2.0 start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,postgres-meta
          npx --yes supabase@3.2.0 status -o json > "$RUNNER_TEMP/supabase.json"
          get() { python3 -c "import json,sys; print(json.load(open(sys.argv[1]))[sys.argv[2]])" "$RUNNER_TEMP/supabase.json" "$1"; }
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(get ANON_KEY)" >> "$GITHUB_ENV"
          echo "SUPABASE_JWT_SECRET=$(get JWT_SECRET)" >> "$GITHUB_ENV"
          { echo "E2E_SUPABASE_STATUS<<STATUS_EOF"; cat "$RUNNER_TEMP/supabase.json"; echo "STATUS_EOF"; } >> "$GITHUB_ENV"
          # fail fast if the database REST API does not accept the service key
          service=$(get SERVICE_ROLE_KEY)
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $service" -H "Authorization: Bearer $service" "http://127.0.0.1:54321/rest/v1/profiles?select=id&limit=1")
          echo "PostgREST with the service key: HTTP $code"
          test "$code" = "200"
      - name: Install the API and seed the databases
        working-directory: apps/api
        run: |
          uv sync --frozen
          uv run python ../../scripts/seed_postgres.py
          uv run python ../../scripts/seed_neo4j.py
          uv run python ../../scripts/seed_vectors.py
      - name: Start the API
        working-directory: apps/api
        run: |
          nohup uv run uvicorn app.main:app --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8000/health/deep | grep -q '"status":"ok"' && exit 0; sleep 2; done
          echo "API did not become healthy"; tail -50 "$RUNNER_TEMP/api.log"; exit 1
      - name: Install the web app and Chromium
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright (all specs)
        working-directory: apps/web
        run: npx playwright test --project=chromium
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
      - name: API log
        if: failure()
        run: tail -200 "$RUNNER_TEMP/api.log"
