name: Keep-alive

# Pings the deployed API's deep health daily. /health/deep runs a query on Postgres AND Neo4j, so
# Neo4j Aura Free (pauses after ~72 h idle) and Supabase Free (pauses after ~7 days idle) stay
# active. Fails (and GitHub e-mails the repo owner) when either dependency is unhealthy.
# Inactive until the repository variable API_URL is set (docs/DEPLOYMENT.md).
# NOTE: GitHub disables scheduled workflows after 60 days without repository activity. If that
# happens: Actions -> Keep-alive -> "Enable workflow" (or push any commit).
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ vars.API_URL != '' }}
    steps:
      - name: Wake the API and check /health/deep
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          # The free Render instance sleeps after 15 min idle and takes about a minute to wake.
          url="${API_URL%/}/health/deep"
          body=$(curl --fail --silent --show-error --retry 6 --retry-delay 20 --retry-all-errors \
            --max-time 90 "$url")
          echo "$body"
          status=$(echo "$body" | jq -r '.status')
          if [ "$status" != "ok" ]; then
            echo "::error::Cognexa API is $status: $(echo "$body" | jq -c '.dependencies')"
            exit 1
          fi
