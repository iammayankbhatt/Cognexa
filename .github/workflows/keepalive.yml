name: Keep-alive

# Pings the deployed API's deep health daily so Neo4j Aura / Supabase free tiers do not pause.
# Inactive until the repository variable API_URL is set (Phase 15).
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ vars.API_URL != '' }}
    steps:
      - name: Ping /health/deep
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 20 --retry-all-errors \
            --max-time 90 "${API_URL%/}/health/deep"
